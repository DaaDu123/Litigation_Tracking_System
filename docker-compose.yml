version: "3.9"

# Litigation Tracking System — single-instance test deployment
# All secrets come from the .env file on the EC2 host (never committed to git).

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lts-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Express"          # free tier; change to "Developer" if you prefer full features for testing
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - lts-network
    # NOTE: intentionally no "ports:" mapping to the host — SQL Server is only
    # reachable from other containers on lts-network, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME}/lts-backend:latest
    container_name: lts-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LTS;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Mail__Host: ${MAIL_HOST}
      Mail__Username: ${MAIL_USERNAME}
      Mail__Password: ${MAIL_PASSWORD}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN}
    networks:
      - lts-network
    # No host port mapping — Nginx reaches it over lts-network only.

  frontend:
    image: ${DOCKERHUB_USERNAME}/lts-frontend:latest
    container_name: lts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      Backend__BaseUrl: "http://backend:8080"
    networks:
      - lts-network

  nginx:
    image: nginx:1.27-alpine
    container_name: lts-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lts-network

volumes:
  sqlserver_data:

networks:
  lts-network:
    driver: bridge
